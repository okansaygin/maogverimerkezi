[project]
name = "maog-veri-merkezi"
version = "5.2.0"
description = "MAOG Projesi personel, puantaj, fazla mesai ve verimlilik veri merkezi (Dash + pywebview masaüstü uygulaması)"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["arsiv"]

[tool.ruff.lint]
# CI yalnızca gerçek hataları (sözdizimi, tanımsız isim vb.) engeller.
select = ["E9", "F63", "F7", "F82"]
